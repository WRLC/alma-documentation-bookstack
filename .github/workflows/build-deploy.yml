
#file: noinspection UndefinedAction,UndefinedParamsPresent
name: Build and Deploy BookStack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Existing Azure resources
  APP_SERVICE_NAME: alma-documentation-bookstack
  DEPLOY_SLOT_NAME: stage
  PHP_VERSION: '8.4'

jobs:
  build:
    name: Build BookStack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify BookStack version
        run: |
          echo "BookStack commit:"
          git -C BookStack rev-parse HEAD

          echo "BookStack version:"
          git -C BookStack describe --tags --exact-match

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, dom, fileinfo, gd, mbstring, xml, zip, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Verify PHP environment
        run: |
          php --version
          composer --version

          # shellcheck disable=SC2016
          php -r '
            $required = [
              "curl",
              "dom",
              "fileinfo",
              "gd",
              "mbstring",
              "xml",
              "zip",
              "pdo_mysql"
            ];

            foreach ($required as $extension) {
              if (!extension_loaded($extension)) {
                fwrite(STDERR, "Missing PHP extension: $extension\n");
                exit(1);
              }
            }

            echo "All required PHP extensions are available.\n";
          '

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: BookStack/vendor
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('BookStack/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: Install Composer dependencies
        working-directory: BookStack
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev

      - name: Verify Composer platform requirements
        working-directory: BookStack
        run: |
          composer check-platform-reqs --no-dev

      - name: Create deployment artifact
        run: |
          zip -r "${APP_SERVICE_NAME}.zip" \
            BookStack/ \
            startup.sh \
            nginx.conf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SERVICE_NAME }}
          path: ${{ env.APP_SERVICE_NAME }}.zip
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy BookStack to Azure Staging
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_SERVICE_NAME }}
          path: .

      - name: Extract deployment package
        run: |
          unzip -q "${APP_SERVICE_NAME}.zip"
          rm "${APP_SERVICE_NAME}.zip"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          slot-name: ${{ env.DEPLOY_SLOT_NAME }}
          package: .
